services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
      env-file: .env

  db:
    image: postgres:15.3-alpine
    container_name: desafio-tecnico-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - desafio-tecnico-db-data:/var/lib/postgresql/data
